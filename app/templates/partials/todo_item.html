<li id="todo-{{ todo.id }}" class="flex items-center gap-3 p-3 bg-white rounded-lg border hover:shadow-sm transition group">
    <button hx-put="/todos/{{ todo.id }}/toggle" hx-target="#todo-{{ todo.id }}" hx-swap="outerHTML"
            class="w-6 h-6 rounded-full border-2 flex items-center justify-center
                   {% if todo.completed %}bg-green-500 border-green-500 text-white{% else %}border-gray-300 hover:border-indigo-400{% endif %}">
        {% if todo.completed %}✓{% endif %}
    </button>

    <span class="flex-1 {% if todo.completed %}line-through text-gray-400{% else %}text-gray-800{% endif %}"
          hx-get="/todos/{{ todo.id }}/edit" hx-target="#todo-{{ todo.id }}" hx-swap="outerHTML"
          role="button" title="Click to edit">
        {{ todo.title }}
    </span>

    <button hx-delete="/todos/{{ todo.id }}" hx-target="#todo-{{ todo.id }}" hx-swap="outerHTML swap:200ms"
            class="opacity-0 group-hover:opacity-100 text-red-400 hover:text-red-600 transition">
        ✕
    </button>
</li>
